<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/style.css">
    <title>Excalibur + Vite</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; }
      #cnv { display: block; width: 100vw; height: 100vh; touch-action: none; }
      #start-screen {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #131617; color: #d0e3e9; font-family: "Sixtyfour", monospace; z-index: 1000;
      }
      #start-screen h1 { font-size: 48px; margin-bottom: 32px; }
      #btn-continue {
        display: none; position: fixed; left: 50%; transform: translate(-50%, -50%);
        font-family: "Sixtyfour", monospace; font-size: 32px; padding: 16px 48px;
        background: #5e676b; color: #d0e3e9; border: none; cursor: pointer; z-index: 300000;
      }
      #btn-continue { top: 68%; }
      #btn-continue:hover { background: #929fa4; color: #131617; }
      #level-transition {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        display: none; flex-direction: column; align-items: center; justify-content: center;
        background: #131617; color: #d0e3e9; font-family: "Sixtyfour", monospace; z-index: 1001;
        transition: opacity 0.4s ease;
      }
      #level-transition h2 { font-size: 28px; margin: 0; opacity: 0.5; letter-spacing: 4px; text-transform: uppercase; }
      #level-transition h1 { font-size: 56px; margin: 12px 0 0; }
      #level-transition .lives { font-size: 32px; margin-top: 24px; color: #e57373; }
    </style>
  </head>
  <body>
    <div id="start-screen">
      <h1>TIME CRITTERS</h1>
      <div style="display: flex; gap: 12px; margin-top: 16px;">
        <button id="btn-play-project" style="display:none;font-family: 'Sixtyfour', monospace; font-size: 18px; padding: 10px 36px; background: #2e7d32; color: #fff; border: none; cursor: pointer;">PLAY PROJECT</button>
        <button id="btn-browse-packs" style="font-family: 'Sixtyfour', monospace; font-size: 18px; padding: 10px 36px; background: #1565c0; color: #fff; border: none; cursor: pointer;">Start</button>
      </div>
      <div id="auth-bar" style="margin-top: 20px; display: flex; gap: 10px; align-items: center; font-family: 'Sixtyfour', monospace; font-size: 12px; color: #929fa4;">
        <button id="btn-sign-in" style="font-family: 'Sixtyfour', monospace; font-size: 12px; padding: 8px 18px; background: #34393c; color: #d0e3e9; border: 1px solid #5e676b; cursor: pointer;">Sign in with Google</button>
        <span id="auth-user" style="display:none;"></span>
        <button id="btn-sign-out" style="display:none; font-family: 'Sixtyfour', monospace; font-size: 12px; padding: 6px 14px; background: #34393c; color: #d0e3e9; border: 1px solid #5e676b; cursor: pointer;">Sign out</button>
      </div>
    </div>
    <button id="btn-continue">Next</button>
    <div id="level-transition">
      <h2 id="transition-subtitle"></h2>
      <h1 id="transition-title"></h1>
      <div class="lives" id="transition-lives"></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
    <canvas id='cnv'> </canvas>
  </body>
</html>
