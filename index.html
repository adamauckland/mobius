<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/style.css">
    <title>Excalibur + Vite</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; }
      #cnv { display: block; width: 100vw; height: 100vh; touch-action: none; }
      #start-screen {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #131617; color: #d0e3e9; font-family: monospace; z-index: 1000;
      }
      #start-screen h1 { font-size: 48px; margin-bottom: 32px; }
      #btn-restart, #btn-continue {
        display: none; position: fixed; left: 50%; transform: translate(-50%, -50%);
        font-family: monospace; font-size: 32px; padding: 16px 48px;
        background: #5e676b; color: #d0e3e9; border: none; cursor: pointer; z-index: 300000;
      }
      #btn-restart { top: 60%; }
      #btn-continue { top: 68%; }
      #btn-restart:hover, #btn-continue:hover { background: #929fa4; color: #131617; }
    </style>
  </head>
  <body>
    <div id="start-screen">
      <h1>MOBIUS</h1>
      <div style="display: flex; gap: 12px; margin-top: 16px;">
        <button id="btn-play-project" style="font-family: monospace; font-size: 18px; padding: 10px 36px; background: #2e7d32; color: #fff; border: none; cursor: pointer;">PLAY PROJECT</button>
        <button id="btn-browse-packs" style="font-family: monospace; font-size: 18px; padding: 10px 36px; background: #1565c0; color: #fff; border: none; cursor: pointer;">BROWSE PACKS</button>
        <button id="btn-editor" style="font-family: monospace; font-size: 18px; padding: 10px 36px; background: #34393c; color: #d0e3e9; border: 2px solid #5e676b; cursor: pointer;">EDITOR</button>
      </div>
    </div>
    <button id="btn-restart">RESTART</button>
    <button id="btn-continue">CONTINUE</button>
    <script type="module" src="./src/main.ts"></script>
    <canvas id='cnv'> </canvas>
  </body>
</html>
